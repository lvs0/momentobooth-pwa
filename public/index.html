<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06060e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MomentoBooth">
<title>MomentoBooth</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- ═════════ ÉCRAN CAPTURE ═════════ -->
<main id="screen-capture" class="screen active">

  <!-- Bandeau filtres (miniatures live + masques) -->
  <div id="filter-strip" class="filter-strip">
    <div id="filter-track" class="filter-strip-track"></div>
  </div>

  <!-- Indicateur mode AUTO -->
  <div id="auto-status" class="auto-status hidden"><span class="auto-dot"></span><span id="auto-status-text">Détection en cours…</span></div>

  <!-- Zone caméra -->
  <div id="camera-zone" class="camera-zone">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="sticker-canvas" class="sticker-canvas"></canvas>
  </div>

  <!-- Hint : touchez l'écran -->
  <div id="tap-hint" class="tap-hint show"><span class="hint-icon">📸</span> Touchez l'écran pour la photo</div>

  <!-- Compte à rebours -->
  <div id="countdown" class="countdown hidden">
    <div class="countdown-ring"><span id="countdown-number" class="countdown-number">5</span></div>
  </div>

  <!-- Barre outils bas (simplifiée, sans shutter) -->
  <div class="bottom-bar">
    <button id="btn-auto" class="tool-btn auto-btn" aria-label="Capture automatique"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
    <button id="btn-backdrop" class="tool-btn" aria-label="Fond"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 5h18v14H3z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="9" r="2" fill="currentColor"/><path d="M4 17l5-5 3 3 3-3 5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button id="btn-flip" class="tool-btn" aria-label="Retourner"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h10a4 4 0 0 1 0 8H4M8 4l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="btn-gallery" class="tool-btn" aria-label="Galerie"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M4 17l5-4 3 3 4-4 4 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  </div>

  <!-- Sheet minuteur (tap écran → choix 5s / 10s) -->
  <div id="sheet-timer" class="sheet sheet-timer">
    <div class="sheet-head">⏱️ Minuteur<span id="timer-close" class="sheet-close">✕</span></div>
    <div id="timer-options" class="timer-options big"></div>
    <div class="sheet-sub">Touchez la durée — la photo se prendra automatiquement</div>
  </div>

  <!-- Sheet fond -->
  <div id="sheet-backdrop" class="sheet">
    <div class="sheet-head">🎨 Fond<span class="sheet-close">✕</span></div>
    <div id="backdrop-options" class="backdrop-options"></div>
    <label class="upload-fond">🖼️ Choisir une image<input id="backdrop-file" type="file" accept="image/*"></label>
    <div class="chroma-toggle"><input id="chroma-check" type="checkbox"><label for="chroma-check">Fond vert magique (chroma)</label></div>
  </div>

</main>

<!-- ═════════ ÉCRAN RÉSULTAT ═════════ -->
<section id="screen-result" class="screen">
  <img id="result-image" class="result-image" alt="Photo">
  <div class="result-actions">
    <button id="btn-retake" class="result-btn ghost">↩ Refaire</button>
    <button id="btn-save" class="result-btn primary">💾 Sauvegarder & partager</button>
  </div>
  <div id="share-box" class="share-box">
    <div class="share-title">Envoyer la photo</div>
    <div class="share-row">
      <button class="share-chip" data-method="whatsapp">WhatsApp</button>
      <button class="share-chip" data-method="sms">SMS</button>
      <button class="share-chip" data-method="email">Email</button>
      <button class="share-chip" data-method="native">Partager</button>
      <button class="share-chip" data-method="qrcode">QR code</button>
      <button class="share-chip" data-method="download">📥 Télécharger</button>
    </div>
    <div id="share-status" class="share-status"></div>
    <div id="share-qr-box" class="share-qr-box hidden"><img id="share-qr" alt="QR code"></div>
  </div>
</section>

<!-- ═════════ ÉCRAN GALERIE ═════════ -->
<section id="screen-gallery" class="screen">
  <div class="gallery-head">
    <button id="btn-back-capture" class="sheet-close">←</button>
    <strong>Galerie</strong>
    <span id="gallery-count" class="gallery-count">0</span>
  </div>
  <div id="gallery-grid" class="gallery-grid"></div>
</section>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script type="module" src="/js/filters.js"></script>
<script type="module" src="/js/masks.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
